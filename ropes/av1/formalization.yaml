    id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb"
    type: "repository"
    location: "lean/OAI/Combinatorics/EuclideanRamsey (proof, vendored unmodified); lean/ComparatorChallenges/EuclideanRamsey.lean and EuclideanRamseySpherical.lean (vocabulary, verbatim)"
    relationship: "builds-on"
    license: "Apache-2.0"
    author_endorsement: "not-contacted"
  - title: "six-concyclic-lean (algebraic spherical sets satisfy the criterion; Ramsey conclusions conditional on the sufficiency hypothesis hsuff)"
    authors:
      - "JD-Jones-ASES"
    id: "https://github.com/JD-Jones-ASES/six-concyclic-lean"
    type: "repository"
    location: "root commit 0703d7d (2026-10-07), Lean v4.35.0-rc2"
    relationship: "background"
    note: "Prior statement of Theorem A (criterion level, unconditional; Ramsey level, conditional on hsuff). Not consulted; no code shared. AV1 discharges hsuff by building on OpenAI's proof."
    license: "MIT"
    author_endorsement: "not-contacted"
  - title: "openai-math-extensions (Theorem A in TeX, same idempotent proof)"
    authors:
