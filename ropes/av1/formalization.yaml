  scope: "Theorem A and its Mathlib-vocabulary restatement; no hypotheses beyond each theorem's own."
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "OAI.EuclideanRamsey.ramsey_of_algebraic"
      file: "Rope/AlgebraicRamsey.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/main.json"
    - declaration: "SphericalRamsey.ramsey_of_algebraic_mathlib"
      file: "Rope/MathlibStatement.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/mathlib.json"
    - declaration: "SphericalRamsey.ramsey_of_algebraic_nonvacuous"
      file: "Rope/MathlibStatement.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/mathlib.json"
    - declaration: "SphericalRamsey.oai_congruent_iff"
      file: "Rope/MathlibStatement.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/equiv.json"
    - declaration: "SphericalRamsey.oai_ramsey_iff"
      file: "Rope/MathlibStatement.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/equiv.json"
    - declaration: "OAI.EuclideanRamsey.classification"
      file: "OAI/Combinatorics/EuclideanRamsey/Main.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/oai-classification.json"
      note: "OpenAI's theorem and OpenAI's challenge, byte for byte; checked here, not ours."
    - declaration: "OAI.EuclideanRamsey.ramsey_cospherical"
      file: "OAI/Combinatorics/EuclideanRamsey/Spherical.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/oai-spherical.json"
      note: "OpenAI's theorem and OpenAI's challenge, byte for byte; shows Ramsey is not vacuous."

fidelity:
  divergences: >-
    No formal-conjectures statement of Graham's spherical conjecture exists, so
    the vocabulary is OpenAI's public Comparator challenge (Space, Congruent,
    Ramsey), copied verbatim and checked by cmp in REPRODUCE. OpenAI's Congruent
    compares dist with arguments b-then-a; Mathlib's compares edist a-then-b; the
    two are proved equivalent (SphericalRamsey.oai_congruent_iff), as are OpenAI's Ramsey
    and its Mathlib-vocabulary unfolding (SphericalRamsey.oai_ramsey_iff). The theorem
    has no affine-span hypothesis (OpenAI's classification has one). "Algebraic
    coordinates" is frame-dependent; Ramsey is congruence-invariant. See
    FIDELITY.md.

review:
  status: "agent-reviewed"
  notes: "Self-assessed by the assembling agent (FIDELITY.md), then reviewed by a non-builder AI agent (Claude Opus 5.5): faithful; its fixes to FIDELITY.md are applied in v1.1. No human review."

acknowledgements: "OpenAI (the classification and its Lean proof); Mathlib; leanprover/comparator. Prior statements of Theorem A: JD-Jones-ASES/six-concyclic-lean, Rogerhu12/openai-math-extensions."
