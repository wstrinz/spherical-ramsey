      framework: "Claude Code"
      tool_setup: "AI agents (Claude Opus 5.5, in Claude Code), directed by the author, wrote Rope/AlgebraicRamsey.lean on top of OpenAI's vendored proof, assembled this package (Rope/MathlibStatement.lean, the Comparator challenges and controls), and ran the checks in WSL Ubuntu with Landlock and on a fresh GitHub runner."
  notes: "Agent-produced. FIDELITY.md had a non-builder AI review (fixes applied in v1.1) and a fresh AI agent reproduced the rope from its README. No human expert has reviewed the proofs or this file."

