version: "v0.4"

project:
  name: "AV1: finite spherical configurations with algebraic coordinates are Euclidean Ramsey"
  description: >-
    Theorem A: a finite configuration of at least two
    distinct points of EuclideanSpace R (Fin d), d >= 1, lying on a sphere and
    with every coordinate algebraic over Q, is Euclidean Ramsey (for every
    r >= 2 there is D >= 1 such that every r-colouring of EuclideanSpace R
    (Fin D) has a monochromatic congruent copy). It builds on OpenAI's complete
    Lean proof of the classification of finite Euclidean Ramsey configurations
    (openai/math fd4aeeb2, result 172), vendored unmodified: the new step shows
    that algebraic spherical configurations satisfy OpenAI's field criterion
    (a separability idempotent of F (x)_Q F for the number field F), and OpenAI's
    fieldCriterion_ramsey concludes. Stated in OpenAI's challenge vocabulary
    (verbatim) and again in Mathlib vocabulary (Metric.sphere, Mathlib's
    Congruent), with the equivalence of the two Congruent notions and of the two
    Ramsey conclusions proved in the rope. The checked theorems depend on
    propext, Classical.choice and Quot.sound only. The only sorries are the
    placeholders in the Comparator challenges and the deliberate sorry in the
    control AV1Control/SorryMain, which Comparator must refuse.
  authors:
    - "Will Strinz"
  license: "MIT for this project's files (the repository's LICENSE); Apache-2.0 for the vendored OpenAI files (vendor/OAI-LICENSE). See NOTICE."

