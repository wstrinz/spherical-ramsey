    - declaration: "OAI.EuclideanRamsey.CircleConsequence.at_most_five_circle_points_ramsey"
      file: "OAI/Combinatorics/EuclideanRamsey/Circle.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/oai-circle.json"
      note: "OpenAI's theorem and OpenAI's challenge, byte for byte; checked here, not ours. AV2 extends it from five points to six."
    - declaration: "OAI.EuclideanRamsey.ramsey_cospherical"
      file: "OAI/Combinatorics/EuclideanRamsey/Spherical.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator/oai-spherical.json"
      note: "OpenAI's theorem and OpenAI's challenge, byte for byte; shows Ramsey is not vacuous."

fidelity:
  divergences: >-
    No formal-conjectures statement exists, so the vocabulary is OpenAI's public
    Comparator challenge (Space, Congruent, Ramsey), copied verbatim and checked
    by cmp in REPRODUCE. "On a circle" is Mathlib's Metric.sphere in
    EuclideanSpace R (Fin 2); OpenAI's five-point challenge writes the same
    condition as dist (a i) c = r. OpenAI's Congruent compares dist with
    arguments b-then-a; Mathlib's compares edist a-then-b; the two are proved
    equivalent (SphericalRamsey.oai_congruent_iff), as are OpenAI's Ramsey and its
    Mathlib-vocabulary unfolding (SphericalRamsey.oai_ramsey_iff). No condition on the
    coordinates and no affine-span hypothesis. Stated for the plane only. See
    FIDELITY.md.

review:
  status: "self-assessed"
  notes: "Self-assessed by the assembling agent (FIDELITY.md). No human review."

acknowledgements: "OpenAI (the classification, its five-point circle theorem and its Lean proof); Mathlib; leanprover/comparator. Prior Lean proof of the six-point criterion: JD-Jones-ASES/six-concyclic-lean."
