version: "v0.4"

project:
  name: "AV3: the radian nine-gon is Euclidean Ramsey iff e^(i theta) is algebraic (Theorem D)"
  description: >-
    Theorem D: the nine points (cos k theta, sin k theta),
    k = 0..8, of EuclideanSpace R (Fin 2) are distinct, lie on the unit circle
    and are not Euclidean Ramsey when tan(theta/2) is transcendental; whenever
    they are distinct, they are Ramsey iff cos theta and sin theta are algebraic
    (iff tan(theta/2) is algebraic). The non-Ramsey direction mirrors OpenAI's
    nine-point proof (openai/math fd4aeeb2, result 172, vendored unmodified):
    the coordinate field is Q(tan(theta/2)), the tensor square embeds in Q(T, U),
    and the denominator-cleared 9x9 evaluation matrix is nonsingular, certified
    at (T, U) = (2, 3) by an explicit integer triangular factorization checked by
    decide +kernel; OpenAI's linear obstruction concludes. The converse is rope
    AV1. Stated in OpenAI's challenge vocabulary (verbatim) plus the 2-line
    definition of the nine points, and again in Mathlib vocabulary. The checked
    theorems depend on propext, Classical.choice and Quot.sound only. The only
    sorries are the placeholders in the Comparator challenges and the deliberate
    sorry in the control AV3Control/SorryMain.
  authors:
    - "Will Strinz"
  license: "MIT for this project's files (the repository's LICENSE); Apache-2.0 for the vendored OpenAI files (vendor/OAI-LICENSE). See NOTICE."

