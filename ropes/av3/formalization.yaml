fidelity:
  divergences: >-
    No formal-conjectures statement exists, so the vocabulary is OpenAI's public
    Comparator challenge (Space, Congruent, Ramsey), copied verbatim and checked
    by cmp in REPRODUCE, plus the 2-line definition radianConfig, checked by cmp
    against the solution. Mathlib's tan has the junk value 0 at odd multiples of
    pi/2; this only excludes theta = pi (mod 2 pi) from the non-Ramsey
    hypothesis, where the statement must not apply anyway. No explicit theta
    with transcendental tan(theta/2) is exhibited: theta = 1 needs
    Lindemann-Weierstrass, which is not in Mathlib at this pin; an explicit
    witness is available in principle (theta = 2 arctan L with L a Liouville
    number, via Mathlib's Liouville.transcendental), but it is not done. See
    FIDELITY.md.

