version: "v0.4"

project:
  name: "AV4: the Euclidean Ramsey property of a spherical set is Möbius invariant (Theorem C)"
  description: >-
    Theorem C: for finitely many distinct points on the
    unit sphere of EuclideanSpace R (Fin d) (no spanning hypothesis) and any
    real matrix L with L^T S L = S, S = diag(-1, 1, ..., 1) (that is, L in
    O(1,d)), the configuration is Euclidean Ramsey iff its image under the
    Möbius map of L is. The Möbius map of L sends x to the spatial part of
    L(1, x) divided by its first coordinate; that these maps are the Möbius
    group of the sphere (PO(1,d)) is the classical identification, cited and
    not proved. Corollaries: Möbius images of algebraic spherical sets are
    Ramsey, and for distinct rational parameters t_i and real k != 0, c, the
    circle sets circ(k t_i) and circ(t_i + c) are Ramsey. It builds on OpenAI's
    complete Lean proof of the classification of finite Euclidean Ramsey
    configurations (openai/math fd4aeeb2, result 172), vendored unmodified:
    OpenAI's necessity direction (made span-free through a congruent spanning
    copy) gives the real tensor criterion, the new step transports it along L,
    and OpenAI's descent and sufficiency conclude. Stated in OpenAI's challenge
    vocabulary (verbatim) plus 7 lines of statement definitions, and again in
    Mathlib vocabulary with no definitions. The checked theorems depend on
    propext, Classical.choice and Quot.sound only. The only sorries are the
    placeholders in the Comparator challenges and the deliberate sorry in the
    control AV4Control/SorryMain.
  authors:
    - "Will Strinz"
  license: "MIT for this project's files (the repository's LICENSE); Apache-2.0 for the vendored OpenAI files (vendor/OAI-LICENSE). See NOTICE."

