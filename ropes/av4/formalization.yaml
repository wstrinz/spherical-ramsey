fidelity:
  divergences: >-
    No formal-conjectures statement exists, so the vocabulary is OpenAI's public
    Comparator challenge (Space, Congruent, Ramsey), copied verbatim and checked
    by cmp in REPRODUCE, plus 7 lines of statement definitions (lorentzForm, aug,
    mobiusMap; and circ, liftO for the corollaries and model checks), checked
    by cmp against the solution. "Möbius transformation of the sphere" is
    modelled through the Lorentz group O(1,d); the identification with the
    Möbius group is classical and cited, not proved; the rope proves each model
    map is a bijection of the sphere, every orthogonal map is a model map, and
    two non-isometric circle maps (t -> kt, t -> t + c) are model maps. No
    spanning hypothesis. The sphere is the unit sphere about 0. See FIDELITY.md.

