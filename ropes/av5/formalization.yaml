  notes: "Self-assessed by the assembling agent (FIDELITY.md), then reviewed by a non-builder AI agent (Claude Opus 5.5, read-only): faithful; its fixes to FIDELITY.md are applied. Fresh-agent reproduction done: reproduced (Claude Sonnet 5.5, exit 0, all 10 as expected), so the rope is Lean-checked (fresh-runner Comparator, non-builder fidelity review, fresh-agent reproduction). No human review."

acknowledgements: "OpenAI (the classification and its Lean proof); Mathlib; leanprover/comparator."
