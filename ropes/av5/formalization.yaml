# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "AV5: algebraic concyclic points plus at most three arbitrary points are Euclidean Ramsey"
  description: >-
    Claim B(b): finitely many distinct points on a
    circle in EuclideanSpace R (Fin 2), all of whose coordinates are algebraic
    over Q except for the points with indices in a set T of at most three, form
    a Euclidean Ramsey configuration. The centre and radius are not assumed
    algebraic. For at most six points this is the six-concyclic-points
    theorem (AV2); otherwise three algebraic points make the circle algebraic, a
    rational rotation and a scaling normalize it, and an explicit certificate
    (separability idempotent times a graph form through the three exceptional
    points) proves OpenAI's field criterion, after which OpenAI's sufficiency
    theorem (openai/math fd4aeeb2, result 172, vendored unmodified) concludes.
    Stated in OpenAI's challenge vocabulary (verbatim) and again in Mathlib
    vocabulary. The checked theorems depend on propext, Classical.choice and
    Quot.sound only. The only sorries are the placeholders in the Comparator
    challenges and the deliberate sorry in the control AV5Control/SorryMain.
  authors:
    - "Will Strinz"
  license: "MIT for this project's files (the repository's LICENSE); Apache-2.0 for the vendored OpenAI files (vendor/OAI-LICENSE). See NOTICE."

sources:
  - title: "A classification of finite Euclidean Ramsey configurations (result 172)"
    authors:
      - "OpenAI"
    id: "https://github.com/openai/math/tree/fd4aeeb2ee4fc729c18d98444fed42fd0529eeeb"
    type: "repository"
    location: "lean/OAI/Combinatorics/EuclideanRamsey (proof, vendored unmodified); lean/ComparatorChallenges/EuclideanRamsey.lean and EuclideanRamseySpherical.lean (vocabulary, verbatim)"
    relationship: "builds-on"
    license: "Apache-2.0"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/blob/d13f23b723b8a846827a245b89c10fc7d3f11612/Mathlib/Topology/MetricSpace/Congruence.lean"
    relationship: "builds-on"
    note: "Mathlib's Congruent, used in the Mathlib-vocabulary statement."

