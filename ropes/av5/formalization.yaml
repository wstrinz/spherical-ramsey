fidelity:
  divergences: >-
    No formal-conjectures statement exists, so the vocabulary is OpenAI's public
    Comparator challenge (Space, Congruent, Ramsey), copied verbatim and checked
    by cmp in REPRODUCE; the statement adds no definitions. OpenAI's Congruent
    and Mathlib's are proved equivalent. "Algebraic coordinates" is
    frame-dependent; Ramsey is congruence-invariant. The theorem is stated for
    the plane. See FIDELITY.md.

review:
