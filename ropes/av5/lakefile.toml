name = "av5"
version = "0.1.0"
defaultTargets = ["OAI", "Rope", "AV5Challenge"]

# Rope AV5: pinned to OpenAI's own pin for openai/math fd4aeeb2 (Lean v4.34.1, Mathlib
# d13f23b723b8a846827a245b89c10fc7d3f11612), because the rope builds on that release's Lean proof.
# OpenAI's package sets autoImplicit = false; so does this one.
leanOptions = { autoImplicit = false }

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

# OpenAI's EuclideanRamsey sources, vendored unmodified (Apache-2.0; see NOTICE and vendor/OAI-LICENSE).
[[lean_lib]]
name = "OAI"
globs = ["OAI.Combinatorics.EuclideanRamsey.+"]

# The solution: claim B(b) (algebraic concyclic points plus at most three arbitrary points), and its Mathlib-vocabulary restatement.
[[lean_lib]]
name = "Rope"
globs = ["Rope", "Rope.+"]

[[lean_lib]]
name = "AV5Challenge"
globs = ["AV5Challenge.+"]

[[lean_lib]]
name = "AV5Control"
globs = ["AV5Control.+"]
